<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Transfer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#0e0f12;--fg:#f2f2f2;--mut:#8b8f98;--card:#1a1c21;--acc:#f5c542;--ok:#4ade80;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f6f4;--fg:#15161a;--mut:#666a72;--card:#fff;--acc:#a97800;--ok:#15803d;color-scheme:light}}
:root[data-theme=dark]{--bg:#0e0f12;--fg:#f2f2f2;--mut:#8b8f98;--card:#1a1c21;--acc:#f5c542;--ok:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin-inline:auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h1 span{color:var(--acc)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button,.btn{background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;flex:1;text-align:center;text-decoration:none;display:block}
button.on,button.pri{background:var(--acc);color:#111;border-color:var(--acc)}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=range]{width:100%}input[type=file]{width:100%;color:var(--fg)}
canvas#qr{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#fff;border-radius:8px;display:block}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}
.bar{height:10px;background:#8883;border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;color:var(--mut)}.st b{color:var(--fg)}
.hide{display:none}.ok{color:var(--ok);font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
small{color:var(--mut)}
</style></head><body>
<h1>📡 Light <span>Transfer</span></h1>
<div class="tabs"><button id="tS" class="on">Send</button><button id="tR">Receive</button></div>

<section id="send">
 <div class="card">
  <input type="file" id="file">
  <label>Chunk size: <b id="csv">300</b> bytes <small>(bigger = denser QR)</small></label>
  <input type="range" id="cs" min="100" max="900" step="50" value="300">
  <label>Frame rate: <b id="fpv">15</b> fps</label>
  <input type="range" id="fp" min="5" max="60" step="5" value="15">
  <div class="row"><button class="pri" id="go" disabled>Start</button><button id="stop" disabled>Stop</button></div>
 </div>
 <div class="card"><canvas id="qr" width="300" height="300"></canvas>
  <div class="st" style="margin-top:10px"><span>Frames sent <b id="sf">0</b></span><span>Blocks needed <b id="sk">–</b></span></div></div>
</section>

<section id="recv" class="hide">
 <div class="card">
  <video id="vid" playsinline muted></video>
  <div class="row"><button class="pri" id="cam">Start camera</button><button id="rst">Reset</button></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="st"><span>Blocks <b id="rb">0/0</b></span><span>Frames seen <b id="rf">0</b></span><span>Speed <b id="rs">0</b> KB/s</span><span>Time <b id="rt">0.0</b> s</span></div>
  <p id="msg" style="margin:10px 0 0"><small>Point the camera at the sender’s screen. Fill the frame, hold steady.</small></p>
  <a id="dl" class="btn pri hide" style="margin-top:10px">Save file</a>
 </div>
</section>

<script>
const $=s=>document.querySelector(s);
// ---------- LT fountain code (shared) ----------
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cc={};
function cdf(k){if(cc[k])return cc[k];const c=.1,d=.5,R=c*Math.log(k/d)*Math.sqrt(k),m=Math.max(1,Math.round(k/R)),p=[];let sum=0;
 for(let i=1;i<=k;i++){let v=i==1?1/k:1/(i*(i-1));if(i<m)v+=R/(i*k);else if(i==m)v+=R*Math.log(R/d)/k;p.push(v);sum+=v}
 let a=0;return cc[k]=p.map(x=>a+=x/sum)}
function nbrs(seed,k){const r=rng(seed*7919+13),u=r(),c=cdf(k);let d=c.findIndex(x=>u<=x)+1||k;const s=new Set();while(s.size<d)s.add(Math.floor(r()*k));return[...s]}
const xor=(a,b)=>{for(let i=0;i<a.length;i++)a[i]^=b[i]};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

// ---------- tabs ----------
function tab(s){$('#send').classList.toggle('hide',!s);$('#recv').classList.toggle('hide',s);$('#tS').classList.toggle('on',s);$('#tR').classList.toggle('on',!s);if(s)stopCam()}
$('#tS').onclick=()=>tab(true);$('#tR').onclick=()=>tab(false);

// ---------- sender ----------
let F=null,sending=false,wl=null;
$('#cs').oninput=e=>$('#csv').textContent=e.target.value;
$('#fp').oninput=e=>$('#fpv').textContent=e.target.value;
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;F={d:new Uint8Array(await f.arrayBuffer()),n:f.name.slice(-24)};$('#go').disabled=false;$('#sk').textContent='–'};
$('#stop').onclick=stopSend;
function stopSend(){sending=false;$('#stop').disabled=true;$('#go').disabled=!F;try{wl&&wl.release()}catch(e){}}
$('#go').onclick=async()=>{
 if(!F)return;const bs=+$('#cs').value,fps=+$('#fp').value,k=Math.ceil(F.d.length/bs);
 const blocks=[];for(let i=0;i<k;i++){const b=new Uint8Array(bs);b.set(F.d.subarray(i*bs,(i+1)*bs));blocks.push(b)}
 const id=Math.random().toString(36).slice(2,6),name=encodeURIComponent(F.n);
 let seed=1,last=0;sending=true;$('#go').disabled=true;$('#stop').disabled=false;$('#sk').textContent=k;
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 const cv=$('#qr'),ctx=cv.getContext('2d');
 function tick(t){
  if(!sending)return;
  if(t-last>=1000/fps-2){last=t;
   const p=new Uint8Array(bs);nbrs(seed,k).forEach(i=>xor(p,blocks[i]));
   const q=qrcode(0,'L');q.addData(`LT|${id}|${k}|${F.d.length}|${seed}|${name}|${b64(p)}`,'Byte');q.make();
   const n=q.getModuleCount(),m=Math.max(3,Math.floor(900/(n+8))),sz=(n+8)*m;
   if(cv.width!=sz)cv.width=cv.height=sz;
   ctx.fillStyle='#fff';ctx.fillRect(0,0,sz,sz);ctx.fillStyle='#000';
   for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))ctx.fillRect((x+4)*m,(y+4)*m,m,m);
   $('#sf').textContent=seed++;
  }
  requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
};

// ---------- receiver ----------
let R=null,stream=null,scanning=false,rx=0,t0=0;
const det='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
function resetRx(){R=null;rx=0;t0=0;$('#pb').style.width=0;$('#rb').textContent='0/0';$('#rf').textContent=0;$('#rs').textContent=0;$('#rt').textContent='0.0';$('#dl').classList.add('hide');$('#msg').innerHTML='<small>Point the camera at the sender’s screen. Fill the frame, hold steady.</small>'}
$('#rst').onclick=resetRx;
function stopCam(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#cam').textContent='Start camera'}
$('#cam').onclick=async()=>{
 if(stream){stopCam();return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}},audio:false})}
 catch(e){$('#msg').textContent='Camera unavailable: '+e.message+' (needs HTTPS and camera permission).';return}
 const v=$('#vid');v.srcObject=stream;await v.play();$('#cam').textContent='Stop camera';scanning=true;scan();
};
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
async function scan(){
 if(!scanning)return;
 const v=$('#vid');
 try{
  if(v.videoWidth){
   if(det){(await det.detect(v)).forEach(x=>onPkt(x.rawValue))}
   else{const w=Math.min(720,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);sc.width=w;sc.height=h;sx.drawImage(v,0,0,w,h);
    const c=jsQR(sx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(c)onPkt(c.data)}
  }
 }catch(e){}
 requestAnimationFrame(scan);
}
function onPkt(s){
 const p=s.split('|');if(p[0]!=='LT'||p.length<7)return;
 const[,id,k,size,seed,name,pl]=p;
 if(!R||R.id!==id){resetRx();R={id,k:+k,size:+size,name:decodeURIComponent(name),blk:Array(+k).fill(null),got:0,pend:[],seen:new Set(),done:false};t0=performance.now()}
 if(R.done||R.seen.has(seed))return;R.seen.add(seed);rx++;
 const data=unb64(pl);R.bs=data.length;
 R.pend.push({nb:nbrs(+seed,R.k),data});peel();ui();
}
function peel(){let ch=true;while(ch){ch=false;
 for(const q of R.pend){
  q.nb=q.nb.filter(i=>{if(R.blk[i]){xor(q.data,R.blk[i]);return false}return true});
  if(q.nb.length==1&&!R.blk[q.nb[0]]){R.blk[q.nb[0]]=q.data;R.got++;ch=true}
 }
 R.pend=R.pend.filter(q=>q.nb.length>1)}}
function ui(){
 const el=(performance.now()-t0)/1000;
 $('#pb').style.width=(100*R.got/R.k)+'%';$('#rb').textContent=R.got+'/'+R.k;$('#rf').textContent=rx;
 $('#rs').textContent=(R.got*R.bs/1024/Math.max(el,.001)).toFixed(1);$('#rt').textContent=el.toFixed(1);
 if(R.got==R.k&&!R.done){
  R.done=true;const out=new Uint8Array(R.k*R.bs);R.blk.forEach((b,i)=>out.set(b,i*R.bs));
  const url=URL.createObjectURL(new Blob([out.subarray(0,R.size)]));
  const a=$('#dl');a.href=url;a.download=R.name||'received.bin';a.textContent='Save '+(R.name||'file')+' ('+(R.size/1024).toFixed(0)+' KB)';a.classList.remove('hide');
  $('#msg').innerHTML='<span class="ok">✓ Transfer complete in '+el.toFixed(1)+' s</span>';
 }
}
</script></body></html>
